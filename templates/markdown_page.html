<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title>
<style>
  :root {
    --bg:#faf9f7; --card:#fff; --line:#e3e1dc; --ink:#1a1917; --ink-2:#5c5a55;
    --ink-3:#87857f; --accent:#2a78d6; --green:#157f5b; --amber:#97650a;
    --red:#c8442c; --code-bg:#f0eee8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#16151a; --card:#1e1d23; --line:#33313a; --ink:#f0eee9;
      --ink-2:#b3b0a8; --ink-3:#87857f; --accent:#5b9cf0; --green:#35b98a;
      --amber:#d9a02c; --red:#e5705a; --code-bg:#2a2831;
    }
  }
  :root[data-theme="dark"] {
    --bg:#16151a; --card:#1e1d23; --line:#33313a; --ink:#f0eee9;
    --ink-2:#b3b0a8; --ink-3:#87857f; --accent:#5b9cf0; --green:#35b98a;
    --amber:#d9a02c; --red:#e5705a; --code-bg:#2a2831;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:17px/1.65 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         -webkit-font-smoothing:antialiased; }
  .wrap { max-width:42rem; margin:0 auto; padding:2rem 1.15rem 4rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:1.5rem 1.5rem; }
  a { color:var(--accent); }
  .doc h1 { font-size:1.6rem; margin:0 0 .3rem; letter-spacing:-.015em; }
  .doc h2 { font-size:1.05rem; margin:2rem 0 .7rem; padding-top:1.2rem;
            border-top:1px solid var(--line); letter-spacing:-.005em; }
  .doc h2:first-of-type { border-top:none; padding-top:0; margin-top:1.4rem; }
  .doc h3 { font-size:.95rem; margin:1.3rem 0 .5rem; color:var(--ink-2); }
  .doc p { margin:0 0 .9rem; font-size:.97rem; }
  .doc ul, .doc ol { margin:0 0 .9rem; padding-left:1.3rem; font-size:.97rem; }
  .doc li { margin-bottom:.55rem; }
  .doc strong { font-weight:680; }
  .doc code { background:var(--code-bg); padding:.1rem .35rem; border-radius:5px;
              font-size:.85em; font-family:ui-monospace,"SF Mono",Consolas,monospace; }
  .doc a { text-decoration-color:var(--line); text-underline-offset:.15em; }
  .doc .scroll-table { overflow-x:auto; margin:0 0 1rem; }
  .doc table { border-collapse:collapse; font-size:.87rem; width:100%;
               font-variant-numeric:tabular-nums; white-space:nowrap; }
  .doc th, .doc td { padding:.4rem .6rem; border-bottom:1px solid var(--line);
                     text-align:left; }
  .doc th { font-size:.68rem; text-transform:uppercase; letter-spacing:.06em;
            color:var(--ink-3); font-weight:640; background:var(--code-bg); }
  .top-nav { margin:0 0 1rem; font-size:.82rem; color:var(--ink-3); }
</style>

<div class="wrap">
  <p class="top-nav"><a href="/">&larr; Today's Five</a></p>
  <div class="card">
    <div class="doc">{{ body|safe }}</div>
  </div>
</div>
<script>
// mistune emits plain <table> — wrap each one for horizontal scroll on
// narrow screens, the same way every other table on this site is wrapped,
// rather than letting a wide table push the page sideways.
document.querySelectorAll(".doc table").forEach(t => {
  const wrap = document.createElement("div");
  wrap.className = "scroll-table";
  t.parentNode.insertBefore(wrap, t);
  wrap.appendChild(t);
});
</script>
