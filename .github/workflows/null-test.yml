# The falsification test the project should have run before any tuning.
#
# Every published number about the strategy answers the wrong question.
# "Profit factor 0.62" says the rules lose money. It does not say whether
# the RULES are the reason — a coin flip managed with the same stop, the
# same target and the same holding period also produces a number, and if
# that number is the same, the pullback logic is decoration.
#
# This runs the real signal and a few dozen coin flips over the same
# stocks and the same days, through byte-for-byte identical exit code,
# and reports where the real expectancy falls in the random distribution.
#
# It runs here rather than on the web instance for the same reason the
# scan does: Yahoo throttles per IP, a runner gets a fresh one, and the
# 512MB instance cannot hold five years of prices for hundreds of names.
name: Null test

on:
  schedule:
    # Weekly, not daily. The methodology and the answer do not move day
    # to day — only the trailing price window inches forward — and
    # re-running a significance test on a schedule shorter than that is
    # its own multiple-comparisons problem: pattern-sweep.yml already
    # states this exact reasoning for the same reason. wide-net is the
    # rule set behind the published board, so the scheduled run tests
    # what the site actually shows, not the untested default.
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      universe_max:
        description: "How many stocks to test over"
        default: "400"
      seeds:
        description: "How many coin-flip runs"
        default: "25"
      preset:
        description: "Which shipped rule set (balanced / relaxed / wide-net)"
        default: "wide-net"

permissions:
  contents: write

concurrency:
  group: null-test
  cancel-in-progress: false

jobs:
  null-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pullback-uptrend-screener-vvlzeb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the permutation test
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT || 'stockscreener@example.com' }}
        run: |
          mkdir -p published
          python scripts/null_test.py \
            --universe-max "${{ github.event.inputs.universe_max || '400' }}" \
            --seeds "${{ github.event.inputs.seeds || '25' }}" \
            --preset "${{ github.event.inputs.preset || 'wide-net' }}" \
            --out published/null_test.json
      - name: Publish the result — including a null result
        if: always()
        run: |
          test -f published/null_test.json || { echo "no result produced"; exit 0; }
          cat published/null_test.json
          mkdir -p pub
          cp published/null_test.json pub/
          # This branch has three other writers (scheduled-scan.yml,
          # pattern-sweep.yml, thirteenf.yml), each following the same
          # rule: carry forward every file this run did not produce, so
          # a publish can never delete data a sibling workflow owns.
          git fetch origin screener-data --depth=1 2>/dev/null || true
          for f in $(git ls-tree --name-only origin/screener-data 2>/dev/null | grep '\.json$'); do
            [ -f "pub/$f" ] || git show "origin/screener-data:$f" > "pub/$f" || true
          done
          for f in $(git ls-tree --name-only origin/screener-data:state 2>/dev/null); do
            mkdir -p pub/state
            [ -f "pub/state/$f" ] || git show "origin/screener-data:state/$f" > "pub/state/$f" || true
          done
          cd pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Null test $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:screener-data
      - name: Summary
        if: always()
        run: |
          if [ -f published/null_test.json ]; then
            python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("published/null_test.json"))
          r, n = d["real"], d["null"]
          print("## Null test\n")
          print(f"**{d['verdict']}**\n")
          print("| | trades | avg R | win rate | profit factor |")
          print("|---|---|---|---|---|")
          print(f"| Real signal | {r['n']} | {r['avg_r']:+.4f} | {r['win_rate_pct']}% | {r['profit_factor']} |")
          print(f"| Random entry | ~{n['mean_trades']} | {n['mean_avg_r']:+.4f} | {n['mean_win_rate']}% | {n['mean_pf']} |")
          print(f"\nz = {d['z']:+.2f}, p = {d['p_value']:.3f} over {n['runs']} coin-flip runs.")
          EOF
          fi
