# Compare rule sets through the 5-year simulation, on a runner rather than
# on the web instance.
#
# Each unseen configuration needs its own five-year download. On the 512MB
# free web instance a five-config sweep does not finish — it was attempted
# and timed out. A runner has more memory, more CPU, and a fresh IP that
# Yahoo has not been throttling all day.
#
# The verdict lands in the job summary as a table, so "does any rule set
# clear the bar" is answerable without opening a log.
name: Strategy sweep

on:
  workflow_dispatch:
    inputs:
      universe_max:
        description: "Stocks to simulate over"
        default: "1200"
      configs:
        description: "Comma-separated config names (blank = all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: strategy-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore simulation history
        run: |
          git fetch origin screener-data --depth=1 2>/dev/null || true
          git show origin/screener-data:state/market.db > /tmp/market.db 2>/dev/null \
            && echo "restored market database" || echo "starting fresh"

      - name: Run the sweep
        env:
          MARKET_DB: /tmp/market.db
          SCREENER_CACHE_DB: /tmp/cache.db
          JOURNAL_DB: /tmp/journal.db
        run: |
          python scripts/sweep.py \
            --universe-max "${{ github.event.inputs.universe_max || '1200' }}" \
            --configs "${{ github.event.inputs.configs || '' }}" \
            --out published/sweep.json

      - name: Publish the verdict
        if: always()
        run: |
          {
            echo "## Strategy sweep"
            echo ""
            echo "Bar: profit factor >= 1.5, drawdown no worse than SPY, Sortino >= 1.0."
            echo "Numbers are for a 5-position portfolio at 1% risk per trade."
            echo ""
            cat published/sweep.md 2>/dev/null || echo "_sweep produced no table_"
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit results to the data branch
        if: always()
        run: |
          [ -f published/sweep.json ] || exit 0
          mkdir -p published/state
          cp /tmp/market.db published/state/market.db 2>/dev/null || true
          cd published
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Strategy sweep $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:screener-data
