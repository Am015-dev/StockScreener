# Test the pattern library against real market history, and publish the
# result whatever it is.
#
# It runs here because it needs a year of daily bars for several hundred
# companies — about ten minutes of polite fetching, which is fine on a
# runner and impossible in a web request. No API key is needed.
#
# The history is cached on the data branch between runs, so later runs
# fetch only the companies they do not already hold.
name: Pattern sweep

on:
  schedule:
    # Once a week. Patterns do not change daily, and re-testing them
    # daily would be its own multiple-comparisons problem — the more
    # often you look, the more often something looks significant.
    - cron: "20 2 * * 6"
  workflow_dispatch:
    inputs:
      span:
        description: "How much history to ask for (1y, 2y, 5y)"
        default: "1y"
      tickers:
        description: "Companies to test on, after ranking"
        default: "400"
      candidates:
        description: "Companies to fetch history for, before ranking"
        default: "800"
      horizons:
        description: "Forward horizons in sessions, comma separated"
        default: "3,5,10"

permissions:
  contents: write

concurrency:
  group: pattern-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore cached history
        run: |
          git fetch origin screener-data --depth=1 2>/dev/null || true
          if git show origin/screener-data:state/pattern_history.json \
               > /tmp/pattern_history.json 2>/dev/null; then
            echo "restored $(python -c "import json;d=json.load(open('/tmp/pattern_history.json'));print(len(d.get('raw') or {}))" 2>/dev/null || echo '?') companies"
          fi

      - name: Sweep
        env:
          # optional: only widens which companies are considered. Without
          # it the built-in universe is used and the sweep runs the same.
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python scripts/pattern_sweep.py \
            --span "${{ github.event.inputs.span || '1y' }}" \
            --tickers "${{ github.event.inputs.tickers || '400' }}" \
            --candidates "${{ github.event.inputs.candidates || '800' }}" \
            --horizons "${{ github.event.inputs.horizons || '3,5,10' }}" \
            --out published/patterns.json \
            --history /tmp/pattern_history.json

      - name: Publish the result — including a null result
        if: always()
        run: |
          test -f published/patterns.json || { echo "nothing produced"; exit 0; }
          mkdir -p pub/state
          cp published/patterns.json pub/
          cp /tmp/pattern_history.json pub/state/ 2>/dev/null || true
          # carry forward everything else on the branch: this workflow
          # publishes ONE file and must never delete the scan's
          git fetch origin screener-data --depth=1 2>/dev/null || true
          for f in $(git ls-tree --name-only origin/screener-data 2>/dev/null | grep '\.json$'); do
            [ -f "pub/$f" ] || git show "origin/screener-data:$f" > "pub/$f" || true
          done
          for f in $(git ls-tree --name-only origin/screener-data:state 2>/dev/null); do
            [ -f "pub/state/$f" ] || git show "origin/screener-data:state/$f" > "pub/state/$f" || true
          done
          cd pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pattern sweep $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:screener-data

      - name: Summary
        if: always()
        continue-on-error: true
        run: |
          test -f published/patterns.json || exit 0
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib, sys
          sys.path.insert(0, ".")
          import patterns
          d = json.loads(pathlib.Path("published/patterns.json").read_text())
          print("## Pattern sweep\n")
          print(f"{d['total_tests']} pattern-horizon combinations over "
                f"{d['sessions']} sessions ({d['from']} to {d['to']}), "
                f"{d['tickers']} tickers.\n")
          if d.get("tradeable"):
              print("| pattern | horizon | edge | after costs | p | n | days |")
              print("|---|---|---|---|---|---|---|")
              for r in d["tradeable"]:
                  print(f"| {r['pattern']} | {r['horizon']}d | "
                        f"{r['edge_pct']:+.2f}% | {r['after_costs_pct']:+.2f}% | "
                        f"{patterns.p_words(r['p'])} | {r['n']} | "
                        f"{r.get('days', '?')} |")
          else:
              print("**Nothing survived.** No pattern beat a random stock that "
                    "was moving just as much, on the same days, by more than "
                    "round-trip costs, after correcting for how many were "
                    "tried. That is the expected result for simple price "
                    "shapes, and publishing it is the point.")
          PY
