services:
  - type: web
    name: pullback-screener
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker only: scan state lives in memory. Threads keep /status
    # responsive while the scan runs; long timeout so gunicorn never kills it.
    # (--threads > 1 auto-selects the gthread worker class even without an
    # explicit -k — confirmed against gunicorn.config.WorkerThreads' own
    # docstring and gunicorn.workers.sync.SyncWorker.run(); this is not the
    # sync-worker misconfiguration it might look like.)
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 600
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Optional, free (finnhub.io, no card): cross-checks US earnings dates.
      # Add FINNHUB_API_KEY in the Render dashboard to enable; works fine without.
